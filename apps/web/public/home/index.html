<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="si-disclosure" content="Development assisted by Codex and Claude. Code and data provenance: /si-provenance.json">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · Guardian</title>
<meta name="description" content="Guardian Space Agency: a calm mission workspace for NASA Space Apps project cards and collections.">
<meta name="theme-color" content="#14273b">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/sitenav.css">
<script>
  // Decide before first paint whether the orbit intro plays (a setting can turn it off).
  (function () {
    var d = document.documentElement;
    d.classList.add('js', 'intro-active', 'intro-chrome');
    try {
      var s = JSON.parse(localStorage.getItem('still.v1') || '{}');
      var force = sessionStorage.getItem('still.forceIntro');
      sessionStorage.removeItem('still.forceIntro');
      if (s.intro === false && !force) d.classList.add('no-intro');
    } catch (e) { /* storage blocked: play the intro */ }
  })();
</script>
</head>
<body>
<div class="scenery" id="scenery" aria-hidden="true"></div>
<a class="skip" href="#main">Skip to content</a>

<header class="topbar" id="topbar">
  <div class="topbar__glass" aria-hidden="true"></div>
  <a class="brand" id="brand" href="#/" aria-label="Guardian Space Agency – go to Dashboard">
    <span class="brand__slot" id="brandSlot"></span>
    <span class="brand__word" aria-hidden="true"><span class="brand__name">GUARDIAN</span><span class="brand__tag">SPACE AGENCY</span></span>
  </a>
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <div class="topbar__actions" id="actions"></div>
</header>

<main id="main" class="page" tabindex="-1"></main>
<footer class="page"><small>Development assisted by Codex and Claude. <a href="/si-provenance.json">SI code and data disclosure</a></small></footer>

<div class="loader" id="loader">
  <div class="loader__stars" aria-hidden="true"></div>
  <div class="loader__tint" aria-hidden="true"></div>
  <p class="loader__caption" role="status">Your assistant is getting ready</p>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<noscript><p class="noscript">Guardian needs JavaScript to run.</p></noscript>

<script src="js/icons.js"></script>
<script src="js/sitenav.js"></script>
<script src="js/store.js"></script>
<script src="js/scenery.js"></script>
<script src="js/mark.js"></script>
<script src="js/loader.js"></script>
<script src="js/app.js"></script>
</body>
</html>
